<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Data Table</title>
    <link rel="stylesheet" href="4.css">
</head>
<body>

<div class="table-container">
    <h2>Student Academic Records</h2>
    <table class="styled-table">
        <thead>
            <tr>
                <th>Roll No</th>
                <th>Name</th>
                <th>Class</th>
                <th>Maths</th>
                <th>Science</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>101</td>
                <td>Alice Johnson</td>
                <td>10-A</td>
                <td>95</td>
                <td>92</td>
                <td><span class="status pass">Pass</span></td>
            </tr>
            <tr class="active-row">
                <td>102</td>
                <td>Bob Smith</td>
                <td>10-A</td>
                <td>55</td>
                <td>60</td>
                <td><span class="status pass">Pass</span></td>
            </tr>
            <tr>
                <td>103</td>
                <td>Charlie Davis</td>
                <td>10-B</td>
                <td>40</td>
                <td>45</td>
                <td><span class="status fail">Fail</span></td>
            </tr>
            <tr class="active-row">
                <td>104</td>
                <td>Diana Evans</td>
                <td>10-B</td>
                <td>88</td>
                <td>90</td>
                <td><span class="status pass">Pass</span></td>
            </tr>
        </tbody>
    </table>
</div>

</body>
</html>
